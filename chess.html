<body>
    <!-- Header -->
    <header class="site-header">
        <a href="/chess.html" class="logo">체스 온라인</a>

        <!-- AdSense Ad Unit -->

            style="display:block"
            data-ad-client="ca-pub-3465506500903274"

            data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <!-- Main Game Container -->
    <div class="game-container">
        <div class="chess-container">
            <div class="chess-main">
                <!-- Turn Indicator -->
                <div class="turn-indicator" id="turn-indicator">
                    백의 차례
                </div>

                <!-- Board Container -->
                <div class="board-container">
                    <canvas id="chess-board"></canvas>
                </div>

                <!-- Game Info -->
                <div class="game-info">
                    <div class="captured-pieces">
                        <span class="label">백 캡처:</span>
                        <span class="pieces" id="white-captured"></span>
                    </div>
                    <div class="captured-pieces">
                        <span class="label">흑 캡처:</span>
                        <span class="pieces" id="black-captured"></span>
                    </div>
                </div>

                <!-- Move History -->
                <div class="history-container">
                    <div class="label">기보</div>
                    <div id="move-history"></div>
                </div>

                <!-- Online Status -->
                <div class="online-panel" id="online-panel" style="display: none;">
                    <span class="online-status" id="online-status"></span>
                    <span class="room-code" id="room-code-display"></span>
                    <button class="control-btn small" id="btn-copy-code" style="display: none;">복사</button>
                </div>

                <!-- Control Buttons -->
                <div class="controls">
                    <button class="control-btn" id="btn-new-game">새 게임</button>
                    <button class="control-btn" id="btn-online">온라인 대전</button>
                    <button class="control-btn" id="btn-undo" disabled>되돌리기</button>
                    <button class="control-btn" id="btn-redo" disabled>다시 실행</button>
                    <button class="control-btn secondary" id="btn-settings">설정</button>
                    <button class="control-btn danger" id="btn-resign">기권</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Ad -->
    <div class="ad-container" id="ad-bottom">
        <!-- AdSense Ad Unit -->

            style="display:block"

    </footer>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2 class="modal-title">설정</h2>

            <div class="setting-group">
                <label>게임 모드</label>
                <select id="game-mode">
                    <option value="ai">AI 대국</option>
                    <option value="local">로컬 대국</option>
                </select>
            </div>

            <div class="setting-group">
                <label>AI 난이도</label>
                <select id="ai-level">
                    <option value="1">초급</option>
                    <option value="2" selected>중급</option>
                    <option value="3">고급</option>
                </select>
            </div>

            <div class="setting-group">
                <label>AI 색상</label>
                <select id="ai-color">
                    <option value="black">흑 (AI가 후공)</option>
                    <option value="white">백 (AI가 선공)</option>
                </select>
            </div>

            <div class="setting-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="sound-enabled" checked>
                    소리
                </label>
            </div>

            <div class="setting-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="board-flipped">
                    보드 뒤집기 (흑 시점)
                </label>
            </div>

            <div class="pgn-buttons">
                <button class="control-btn secondary" id="btn-save-pgn">PGN 저장</button>
                <button class="control-btn secondary" id="btn-load-pgn">PGN 불러오기</button>
            </div>
            <input type="file" id="pgn-file-input" accept=".pgn,.txt">

            <div class="modal-buttons">
                <button class="control-btn" id="btn-save-settings">저장</button>
                <button class="control-btn secondary" id="btn-close-settings">닫기</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal-overlay" id="gameover-modal">
        <div class="modal">
            <div class="gameover-content">
                <h2 class="modal-title">게임 종료</h2>
                <div id="game-result">백 승리!</div>
                <div id="game-reason">체크메이트</div>

                <div class="modal-buttons">
                    <button class="control-btn" id="btn-rematch">다시 하기</button>
                    <button class="control-btn secondary" id="btn-close-gameover">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Promotion Modal -->
    <div class="modal-overlay" id="promotion-modal">
        <div class="modal">
            <div class="promotion-content">
                <h2 class="modal-title">프로모션</h2>
                <p>승격할 기물을 선택하세요</p>

                <div class="promotion-pieces">
                    <button class="promotion-piece" data-piece="Q">♕</button>
                    <button class="promotion-piece" data-piece="R">♖</button>
                    <button class="promotion-piece" data-piece="B">♗</button>
                    <button class="promotion-piece" data-piece="N">♘</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <!-- Curtain Effect -->
    <div id="curtain"></div>

    <!-- Online Game Modal -->
    <div class="modal-overlay" id="online-modal">
        <div class="modal">
            <h2 class="modal-title">온라인 대전</h2>

            <div class="setting-group">
                <label>플레이어 이름</label>
                <input type="text" id="player-name" placeholder="이름 입력" maxlength="20">
            </div>

            <div class="online-options">
                <button class="control-btn" id="btn-create-room" style="width: 100%; margin-bottom: 10px;">
                    방 만들기 (백)
                </button>

                <div class="divider-text" style="text-align: center; margin: 15px 0; color: #999;">또는</div>

                <div class="setting-group">
                    <label>방 코드로 참가</label>
                    <input type="text" id="join-room-code" placeholder="방 코드 입력">
                </div>
                <button class="control-btn" id="btn-join-room" style="width: 100%;">
                    참가하기 (흑)
                </button>
            </div>

            <div id="waiting-section" style="display: none; text-align: center; padding: 20px 0;">
                <p style="margin-bottom: 10px;">상대방을 기다리는 중...</p>
                <div style="font-size: 24px; font-weight: bold; margin: 15px 0; padding: 10px; background: #f5f5f5; border-radius: 8px;">
                    <span id="display-room-code"></span>
                    <button class="control-btn small" id="btn-copy-room" style="margin-left: 10px; font-size: 12px; padding: 5px 10px;">복사</button>
                </div>
                <p style="font-size: 12px; color: #999;">위 코드를 상대방에게 공유하세요</p>
            </div>

            <div class="modal-buttons" style="margin-top: 20px;">
                <button class="control-btn secondary" id="btn-close-online">닫기</button>
            </div>
        </div>
    </div>
